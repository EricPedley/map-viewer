name: Fetch OSM data

# Derives turn-by-turn cues and convenience-store POIs for the .fit routes
# from OpenStreetMap (see scripts/fetch-osm.mjs) and commits the small result
# to source-data/osm/. Runs when a route or the derivation logic changes, or
# on demand from the Actions tab.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'source-data/routes/*.fit'
      - 'scripts/osm-turns.mjs'
      - 'scripts/fetch-osm.mjs'
      - '.github/workflows/fetch-osm.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-osm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # --force: the derivation logic may have changed even if the track didn't.
      - run: npm run fetch-osm -- --force
      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-data/osm
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OSM data unchanged."
          else
            git commit -m "Update OSM-derived turn cues and stores"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so on
      # main kick off the Pages deploy explicitly.
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
